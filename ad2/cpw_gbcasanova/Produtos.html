<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">

    <title>Produtos - Carrapet Patashop</title>
  </head>

  <body>
    <!-- Cabeçalho -->
    <header>
      <!-- Logotipo -->
      <img id="logo-topo" alt="Carrapet Logo" src="img/CarrapetLogoTopo.png">

      <!-- Endereço -->
      <address id="ender">
        Largo do Frajola, 23
        <br/>
        Tel: (21) 94321-1234
        <br/>
        contato@carrapet.com.br
      </address>
    </header>

    <!-- Barra de Navegação -->
    <nav>
      <ul id="barra-navegacao">
        <li><a href="index.html">Apresentação</a></li>
        <li><a href="Cuidados.html">Cuidados</a></li>
        <li><a href="Produtos.html">Produtos</a></li>
        <li><a href="Pedidos.html">Pedidos</a></li>
      </ul>
    </nav>

    <!-- Conteúdo da Página -->
    <section>
      <table id="tabProd">
        <!-- Topo da Tabela -->
        <tr>
          <th colspan="5" class="linTH">Produtos para seu Pet</th>
        </tr>
        <tr>
          <th class="linTH">Tipo</th>
          <th class="linTH">Pet</th>
          <th class="linTH">Descrição</th>
        </tr>

        <!-- Lista de Produtos -->
        <tr>
          <td rowspan="3" class="colTH">Ração</td>
          <td><img class="imgPet" src="img/Cao40.png"/><br/><a href="#" onclick="mudarDescricao('pedigree')">Carne</a></td>

            <h2 id="descTitulo"></h1>
            <img id="descImagem" src="img/vazio_150.png">
            <p id="descSabor"></p>
            <p id="descPeso"></p>
            <p><span id="valorPreco" class="preco"></span></p>
          </td>
        </tr>

        <tr>
          <td><img class="imgPet" src="img/Cao40.png"/><br/><a href="#" onclick="mudarDescricao('aipo')">Carne e Frango</a></td>
        </tr>

        <tr>
          <td><img class="imgPet" src="img/Gato40.png"/><br/><a href="#" onclick="mudarDescricao('gran')">Carne e Frango</a></td>
        </tr>

        <td rowspan="1" class="colTH">Brinquedo</td>
          <td><img class="imgPet" src="img/Cao40.png"/><br/><a href="#" onclick="mudarDescricao('osso')">Osso Silicone</a></td>
        </tr>
      </table>

    <script src="script.js"></script>
